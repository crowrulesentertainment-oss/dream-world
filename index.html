<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>CrowRules Dream World</title>

<meta name="theme-color" content="#030303">
<meta name="description"
content="CrowRules Dream World — Where dreams become stories, creators become collaborators, and ideas become worlds.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800;900&display=swap" rel="stylesheet">

<style>

:root{
  --black:#020202;
  --red:#d80000;
  --bright:#ff2424;
  --darkred:#470000;
  --white:#fff;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
  font-family:Montserrat,sans-serif;
  color:white;
}

/* =========================================================
   MASTER CINEMA
========================================================= */

#cinema{
  position:relative;
  width:100%;
  height:100svh;
  overflow:hidden;
  background:#000;
}

/* =========================================================
   FILM GRAIN
========================================================= */

.grain{
  position:absolute;
  inset:-50%;
  z-index:80;
  pointer-events:none;

  opacity:.075;

  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");

  animation:grain .15s steps(2) infinite;
}

@keyframes grain{
  0%{transform:translate(0,0)}
  25%{transform:translate(2%,1%)}
  50%{transform:translate(-1%,2%)}
  75%{transform:translate(1%,-2%)}
  100%{transform:translate(-2%,0)}
}

/* =========================================================
   CINEMATIC LETTERBOX
========================================================= */

.letterbox{
  position:absolute;
  left:0;
  width:100%;
  height:9vh;
  background:#000;
  z-index:70;
  pointer-events:none;
}

.letterbox.top{top:0}
.letterbox.bottom{bottom:0}

/* =========================================================
   DREAM SCENES
========================================================= */

.scene{
  position:absolute;
  inset:0;

  opacity:0;
  visibility:hidden;

  transform:scale(1.12);

  transition:
    opacity 2s ease,
    transform 8s cubic-bezier(.2,.7,.2,1);

  overflow:hidden;
}

.scene.active{
  opacity:1;
  visibility:visible;
  transform:scale(1);
}

.scene::after{
  content:"";
  position:absolute;
  inset:0;

  background:
    radial-gradient(
      ellipse at center,
      transparent 20%,
      rgba(0,0,0,.15) 55%,
      rgba(0,0,0,.9) 100%
    );
}

/* =========================================================
   SCENE 1 — THE VOID
========================================================= */

.void{
  background:
    radial-gradient(
      circle at 50% 55%,
      rgba(100,0,0,.2),
      transparent 30%
    ),
    #000;
}

.void-light{
  position:absolute;

  width:50vw;
  height:50vw;

  left:50%;
  top:60%;

  transform:translate(-50%,-50%);

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(255,0,0,.35),
      rgba(100,0,0,.12) 30%,
      transparent 70%
    );

  filter:blur(40px);

  animation:voidPulse 6s ease-in-out infinite;
}

@keyframes voidPulse{
  0%,100%{
    transform:translate(-50%,-50%) scale(.7);
    opacity:.3;
  }

  50%{
    transform:translate(-50%,-50%) scale(1.1);
    opacity:1;
  }
}

/* =========================================================
   SCENE 2 — MOON
========================================================= */

.moon-scene{
  background:
    linear-gradient(
      to bottom,
      #010101 0%,
      #090000 50%,
      #210000 100%
    );
}

.moon{
  position:absolute;

  width:min(42vw,560px);
  aspect-ratio:1;

  left:68%;
  top:39%;

  transform:translate(-50%,-50%);

  border-radius:50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #ff6868,
      #e00000 45%,
      #6d0000 72%,
      #160000 100%
    );

  box-shadow:
    0 0 40px rgba(255,0,0,.35),
    0 0 120px rgba(210,0,0,.25),
    0 0 240px rgba(130,0,0,.18);

  animation:moonFloat 9s ease-in-out infinite;
}

@keyframes moonFloat{

  0%,100%{
    transform:translate(-50%,-50%) translateY(0);
  }

  50%{
    transform:translate(-50%,-50%) translateY(-20px);
  }

}

.moon-crater{
  position:absolute;
  border-radius:50%;
  background:rgba(60,0,0,.2);
}

.c1{
  width:13%;
  height:13%;
  left:22%;
  top:27%;
}

.c2{
  width:9%;
  height:9%;
  right:20%;
  top:55%;
}

.c3{
  width:17%;
  height:17%;
  left:48%;
  bottom:20%;
}

/* =========================================================
   CLOUDS
========================================================= */

.cloud{
  position:absolute;

  width:60vw;
  height:15vh;

  border-radius:50%;

  background:
    rgba(30,0,0,.55);

  filter:blur(35px);

  animation:cloudDrift 30s linear infinite;
}

.cloud:nth-child(1){
  top:25%;
  left:-50%;
}

.cloud:nth-child(2){
  top:55%;
  left:-30%;
  transform:scale(.7);
  animation-duration:40s;
}

.cloud:nth-child(3){
  top:70%;
  left:-60%;
  transform:scale(1.4);
  animation-duration:55s;
}

@keyframes cloudDrift{
  from{
    transform:translateX(0);
  }

  to{
    transform:translateX(180vw);
  }
}

/* =========================================================
   SCENE 3 — DREAM FOREST
========================================================= */

.forest{
  background:
    radial-gradient(
      ellipse at 50% 55%,
      rgba(130,0,0,.45),
      transparent 40%
    ),
    linear-gradient(
      to bottom,
      #020202,
      #170000 65%,
      #030303
    );
}

.tree{
  position:absolute;
  bottom:-5%;

  width:7vw;
  height:90%;

  background:
    linear-gradient(
      90deg,
      #010101,
      #170000,
      #020202
    );

  clip-path:polygon(
    40% 0,
    65% 0,
    60% 35%,
    100% 100%,
    0 100%,
    40% 35%
  );

  opacity:.9;
}

.tree:nth-child(1){
  left:2%;
  height:80%;
}

.tree:nth-child(2){
  left:17%;
  height:100%;
}

.tree:nth-child(3){
  left:32%;
  height:75%;
}

.tree:nth-child(4){
  left:52%;
  height:110%;
}

.tree:nth-child(5){
  left:70%;
  height:85%;
}

.tree:nth-child(6){
  left:87%;
  height:105%;
}

.forest-light{
  position:absolute;

  width:12vw;
  height:100%;

  left:50%;
  bottom:0;

  transform:translateX(-50%);

  background:
    linear-gradient(
      to bottom,
      transparent,
      rgba(255,0,0,.22),
      transparent
    );

  filter:blur(20px);
}

/* =========================================================
   SCENE 4 — CREATOR DREAM
========================================================= */

.creator{
  background:
    radial-gradient(
      circle at 50% 45%,
      rgba(255,0,0,.16),
      transparent 35%
    ),
    #030303;
}

.creator-room{
  position:absolute;
  inset:10%;

  border:
    1px solid rgba(255,0,0,.15);

  background:
    linear-gradient(
      120deg,
      rgba(255,0,0,.03),
      rgba(255,255,255,.015)
    );

  transform:
    perspective(900px)
    rotateX(4deg);

  box-shadow:
    inset 0 0 100px rgba(255,0,0,.06);
}

.screen{
  position:absolute;

  width:17vw;
  height:11vw;

  border:1px solid rgba(255,0,0,.5);

  background:
    linear-gradient(
      135deg,
      rgba(255,0,0,.2),
      rgba(10,0,0,.8)
    );

  box-shadow:
    0 0 30px rgba(255,0,0,.12);

  animation:screenFloat 5s ease-in-out infinite;
}

.screen::before{
  content:"";

  position:absolute;
  inset:12%;

  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.08) 0 2px,
      transparent 2px 9px
    );
}

.screen:nth-child(1){
  left:15%;
  top:20%;
}

.screen:nth-child(2){
  right:15%;
  top:35%;
  animation-delay:1s;
}

.screen:nth-child(3){
  left:38%;
  bottom:12%;
  animation-delay:2s;
}

@keyframes screenFloat{

  0%,100%{
    transform:translateY(0) rotateY(0);
  }

  50%{
    transform:translateY(-18px) rotateY(5deg);
  }

}

/* =========================================================
   SCENE 5 — INFINITE SKY
========================================================= */

.sky{
  background:
    radial-gradient(
      circle at 50% 50%,
      #260000,
      #050000 45%,
      #000 80%
    );
}

.sky-orb{
  position:absolute;

  width:35vw;
  height:35vw;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(255,0,0,.35),
      transparent 65%
    );

  filter:blur(15px);

  animation:orbPulse 5s ease-in-out infinite;
}

@keyframes orbPulse{

  0%,100%{
    transform:translate(-50%,-50%) scale(.8);
  }

  50%{
    transform:translate(-50%,-50%) scale(1.2);
  }

}

/* =========================================================
   CROW
========================================================= */

.crow-flight{
  position:absolute;

  width:280px;
  height:160px;

  left:-20%;
  top:40%;

  z-index:20;

  opacity:0;

  pointer-events:none;
}

.crow-flight.fly{
  animation:crowAcross 7s cubic-bezier(.2,.6,.3,1) forwards;
}

.crow{
  position:relative;
  width:100%;
  height:100%;

  filter:
    drop-shadow(0 0 15px #000)
    drop-shadow(0 0 15px rgba(255,0,0,.15));
}

.body{
  position:absolute;

  width:35%;
  height:24%;

  left:35%;
  top:45%;

  border-radius:60%;

  background:#000;

  transform:rotate(-8deg);
}

.head{
  position:absolute;

  width:15%;
  height:19%;

  left:65%;
  top:33%;

  border-radius:50%;

  background:#000;
}

.beak{
  position:absolute;

  left:77%;
  top:38%;

  width:18%;
  height:8%;

  background:#000;

  clip-path:polygon(
    0 0,
    100% 50%,
    0 100%
  );
}

.wing{
  position:absolute;

  width:55%;
  height:22%;

  top:30%;

  border-radius:100% 10% 90% 10%;

  background:#000;

  transform-origin:90% 70%;
}

.wing.left{
  left:0;

  animation:flap 1s ease-in-out infinite;
}

.wing.right{
  right:5%;

  transform:scaleX(-1);

  animation:flap 1s .2s ease-in-out infinite;
}

.tail{
  position:absolute;

  left:18%;
  top:52%;

  width:30%;
  height:18%;

  background:#000;

  clip-path:polygon(
    100% 30%,
    0 0,
    20% 100%
  );
}

@keyframes flap{

  0%,100%{
    transform:rotate(-20deg);
  }

  50%{
    transform:rotate(20deg);
  }

}

@keyframes crowAcross{

  0%{
    left:-25%;
    top:65%;
    transform:scale(.5) rotate(-5deg);
    opacity:0;
  }

  10%{
    opacity:1;
  }

  45%{
    left:40%;
    top:40%;
    transform:scale(1.1) rotate(2deg);
  }

  75%{
    left:75%;
    top:25%;
    transform:scale(.8) rotate(-4deg);
  }

  100%{
    left:120%;
    top:5%;
    transform:scale(.45);
    opacity:0;
  }

}

/* =========================================================
   PARTICLES
========================================================= */

#particles{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  z-index:15;

  pointer-events:none;
}

/* =========================================================
   TITLE
========================================================= */

.title-card{
  position:absolute;

  inset:0;

  display:flex;
  flex-direction:column;

  justify-content:center;
  align-items:center;

  text-align:center;

  z-index:50;

  opacity:0;
  pointer-events:none;

  transition:
    opacity 2s ease;
}

.title-card.show{
  opacity:1;
}

.kicker{
  margin-bottom:20px;

  color:#ff3737;

  font-size:.75rem;
  font-weight:800;

  letter-spacing:.5em;
  text-transform:uppercase;
}

.title{
  font-family:Orbitron,sans-serif;

  font-size:clamp(3rem,9vw,9rem);

  line-height:.85;

  font-weight:900;

  letter-spacing:-.07em;

  text-transform:uppercase;

  text-shadow:
    0 0 30px rgba(255,0,0,.15);
}

.title span{
  display:block;

  background:
    linear-gradient(
      110deg,
      #fff,
      #fff 35%,
      #ff2525 70%,
      #8a0000
    );

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;
}

.tagline{
  margin-top:28px;

  font-size:clamp(.9rem,1.5vw,1.2rem);

  color:#ccc;

  letter-spacing:.08em;
}

/* =========================================================
   ENTER BUTTON
========================================================= */

.enter{
  margin-top:35px;

  padding:16px 34px;

  border:1px solid rgba(255,0,0,.55);

  color:#fff;

  background:rgba(120,0,0,.18);

  backdrop-filter:blur(12px);

  text-decoration:none;

  font-size:.78rem;
  font-weight:800;

  letter-spacing:.18em;

  text-transform:uppercase;

  transition:.3s;

  pointer-events:auto;
}

.enter:hover{
  background:#d80000;

  border-color:#ff2222;

  box-shadow:
    0 0 40px rgba(255,0,0,.3);

  transform:translateY(-3px);
}

/* =========================================================
   CINEMA TEXT
========================================================= */

.story{
  position:absolute;

  left:50%;
  top:50%;

  width:90%;

  transform:translate(-50%,-50%);

  text-align:center;

  z-index:45;

  opacity:0;

  transition:
    opacity 1.5s ease,
    transform 2s ease;
}

.story.show{
  opacity:1;

  transform:
    translate(-50%,-50%)
    scale(1);
}

.story p{
  font-family:Orbitron,sans-serif;

  font-size:clamp(1.2rem,3vw,3rem);

  font-weight:600;

  letter-spacing:.08em;

  text-transform:uppercase;

  text-shadow:
    0 0 30px rgba(255,0,0,.3);
}

/* =========================================================
   SKIP
========================================================= */

.skip{
  position:absolute;

  right:30px;
  bottom:30px;

  z-index:100;

  padding:10px 16px;

  border:1px solid rgba(255,255,255,.18);

  background:rgba(0,0,0,.45);

  color:rgba(255,255,255,.75);

  font-size:.65rem;

  letter-spacing:.15em;

  text-transform:uppercase;

  cursor:pointer;

  backdrop-filter:blur(8px);

  transition:.25s;
}

.skip:hover{
  color:#fff;

  border-color:#e00000;
}

/* =========================================================
   PROGRESS
========================================================= */

.progress{
  position:absolute;

  left:0;
  bottom:0;

  width:100%;
  height:2px;

  z-index:100;

  background:rgba(255,255,255,.08);
}

.progress-bar{
  height:100%;
  width:0;

  background:#e00000;

  box-shadow:
    0 0 10px #e00000;

  transition:
    width .2s linear;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

  .letterbox{
    height:5vh;
  }

  .moon{
    width:75vw;
    left:70%;
  }

  .screen{
    width:30vw;
    height:20vw;
  }

  .crow-flight{
    width:190px;
    height:110px;
  }

  .story p{
    font-size:1rem;
    line-height:1.6;
  }

  .title{
    font-size:clamp(3rem,16vw,6rem);
  }

  .skip{
    right:15px;
    bottom:18px;
  }

}

/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation:none!important;
    transition:none!important;
  }

}

</style>
</head>

<body>

<div id="cinema">

  <!-- Film grain -->
  <div class="grain"></div>

  <!-- Letterbox -->
  <div class="letterbox top"></div>
  <div class="letterbox bottom"></div>

  <!-- =====================================================
       SCENE 1
  ====================================================== -->

  <section class="scene void active">

    <div class="void-light"></div>

  </section>

  <!-- =====================================================
       SCENE 2
  ====================================================== -->

  <section class="scene moon-scene">

    <div class="moon">

      <div class="moon-crater c1"></div>
      <div class="moon-crater c2"></div>
      <div class="moon-crater c3"></div>

    </div>

    <div class="cloud"></div>
    <div class="cloud"></div>
    <div class="cloud"></div>

  </section>

  <!-- =====================================================
       SCENE 3
  ====================================================== -->

  <section class="scene forest">

    <div class="forest-light"></div>

    <div class="tree"></div>
    <div class="tree"></div>
    <div class="tree"></div>
    <div class="tree"></div>
    <div class="tree"></div>
    <div class="tree"></div>

  </section>

  <!-- =====================================================
       SCENE 4
  ====================================================== -->

  <section class="scene creator">

    <div class="creator-room">

      <div class="screen"></div>
      <div class="screen"></div>
      <div class="screen"></div>

    </div>

  </section>

  <!-- =====================================================
       SCENE 5
  ====================================================== -->

  <section class="scene sky">

    <div class="sky-orb"></div>

  </section>

  <!-- =====================================================
       FLYING CROW
  ====================================================== -->

  <div class="crow-flight" id="crowFlight">

    <div class="crow">

      <div class="body"></div>
      <div class="head"></div>
      <div class="beak"></div>

      <div class="wing left"></div>
      <div class="wing right"></div>

      <div class="tail"></div>

    </div>

  </div>

  <!-- =====================================================
       PARTICLES
  ====================================================== -->

  <canvas id="particles"></canvas>

  <!-- =====================================================
       STORY TEXT
  ====================================================== -->

  <div class="story" id="story"></div>

  <!-- =====================================================
       FINAL TITLE
  ====================================================== -->

  <div class="title-card" id="titleCard">

    <div class="kicker">
      CrowRules Entertainment
    </div>

    <h1 class="title">
      Dream
      <span>World</span>
    </h1>

    <p class="tagline">
      Where ideas become worlds.
    </p>

    <a
      href="home.html"
      class="enter"
    >
      Enter the Dream
    </a>

  </div>

  <!-- =====================================================
       CONTROLS
  ====================================================== -->

  <button
    class="skip"
    id="skip"
    type="button"
  >
    Skip Intro
  </button>

  <div class="progress">
    <div
      class="progress-bar"
      id="progress"
    ></div>
  </div>

</div>


<script>

/* ==========================================================
   DREAM WORLD CINEMATIC ENGINE
========================================================== */

const scenes =
  document.querySelectorAll(".scene");

const story =
  document.getElementById("story");

const titleCard =
  document.getElementById("titleCard");

const crow =
  document.getElementById("crowFlight");

const skip =
  document.getElementById("skip");

const progress =
  document.getElementById("progress");


/*
   Timeline

   0–5     The Void
   5–12    The Moon
   12–19   The Forest
   19–26   The Creator
   26–34   The Infinite Sky
   34–42   Crow flight
   42–46   Final title
*/

const timeline = [

  {
    start:0,
    end:5,
    scene:0,
    text:"Every dream begins somewhere."
  },

  {
    start:5,
    end:12,
    scene:1,
    text:"Sometimes... it begins in the dark."
  },

  {
    start:12,
    end:19,
    scene:2,
    text:"Then the impossible becomes possible."
  },

  {
    start:19,
    end:26,
    scene:3,
    text:"An idea becomes a creation."
  },

  {
    start:26,
    end:34,
    scene:4,
    text:"And a creation becomes a world."
  },

  {
    start:34,
    end:42,
    scene:4,
    text:"All you have to do... is dream."
  },

  {
    start:42,
    end:46,
    scene:4,
    text:""
  }

];


let startTime = null;
let finished = false;


/* ==========================================================
   ACTIVATE SCENE
========================================================== */

function activateScene(index){

  scenes.forEach((scene,i)=>{

    scene.classList.toggle(
      "active",
      i === index
    );

  });

}


/* ==========================================================
   STORY TEXT
========================================================== */

function showStory(text){

  if(!text){

    story.classList.remove("show");

    return;
  }

  story.innerHTML =
    `<p>${text}</p>`;

  story.classList.remove("show");

  /*
     Force reflow so the animation
     can restart between scenes.
  */

  void story.offsetWidth;

  story.classList.add("show");
}


/* ==========================================================
   MAIN TIMELINE
========================================================== */

function cinematicLoop(timestamp){

  if(finished) return;

  if(!startTime){
    startTime = timestamp;
  }

  const elapsed =
    (timestamp - startTime) / 1000;

  const total =
    46;

  progress.style.width =
    Math.min(
      100,
      (elapsed / total) * 100
    ) + "%";


  const current =
    timeline.find(item =>
      elapsed >= item.start &&
      elapsed < item.end
    );


  if(current){

    activateScene(current.scene);

    /*
       Only change text when needed.
    */

    if(story.dataset.text !== current.text){

      story.dataset.text =
        current.text;

      showStory(current.text);
    }

  }


  /*
     Crow entrance
  */

  if(elapsed >= 34 && elapsed < 42){

    if(!crow.classList.contains("fly")){

      crow.classList.add("fly");

    }

  }


  /*
     Final title
  */

  if(elapsed >= 42){

    titleCard.classList.add("show");

    story.classList.remove("show");

  }


  /*
     End cinematic
  */

  if(elapsed >= total){

    finishIntro();

    return;
  }


  requestAnimationFrame(
    cinematicLoop
  );
}


/* ==========================================================
   FINISH
========================================================== */

function finishIntro(){

  finished = true;

  titleCard.classList.add("show");

  progress.style.width="100%";

  /*
     Remember that the visitor
     has completed the cinematic.
  */

  try{

    localStorage.setItem(
      "crowrulesDreamWorldIntroSeen",
      "true"
    );

  }catch(e){}

}


/* ==========================================================
   SKIP
========================================================== */

skip.addEventListener(
  "click",
  finishIntro
);


/* ==========================================================
   PARTICLE SYSTEM
========================================================== */

const canvas =
  document.getElementById("particles");

const ctx =
  canvas.getContext("2d");

let particles = [];

function resize(){

  canvas.width =
    window.innerWidth;

  canvas.height =
    window.innerHeight;

  createParticles();

}


function createParticles(){

  particles = [];

  const count =
    Math.min(
      170,
      Math.floor(
        window.innerWidth *
        window.innerHeight /
        9000
      )
    );

  for(let i=0;i<count;i++){

    particles.push({

      x:
        Math.random() *
        canvas.width,

      y:
        Math.random() *
        canvas.height,

      size:
        Math.random()*2+.2,

      speed:
        Math.random()*.35+.05,

      opacity:
        Math.random()*.7+.1,

      phase:
        Math.random()*
        Math.PI*2

    });

  }

}


function drawParticles(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  particles.forEach(p=>{

    p.y -= p.speed;

    p.phase += .015;

    if(p.y < -10){

      p.y =
        canvas.height + 10;

    }

    const alpha =
      Math.max(
        .02,
        p.opacity +
        Math.sin(p.phase)*.2
      );

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fillStyle =
      `rgba(255,35,35,${alpha})`;

    ctx.fill();

  });

  requestAnimationFrame(
    drawParticles
  );

}


window.addEventListener(
  "resize",
  resize
);

resize();
drawParticles();


/* ==========================================================
   START
========================================================== */

requestAnimationFrame(
  cinematicLoop
);

</script>
